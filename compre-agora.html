<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Compre Agora</title>
    <link rel="stylesheet" href="css/compre-agora.css">
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <button class="uiverse-btn" onclick="window.history.back()" style="position: absolute; top: 20px; left: 20px; z-index: 1000;">Voltar</button>
    <div class="compra-container">
        <h1>Compre Agora</h1>
        <form class="form-compra">
            <label for="tamanho">Selecione o tamanho:</label>
            <select id="tamanho" name="tamanho" required style="margin-bottom: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; padding: 4px 12px; border-radius: 6px; border: 1px solid #a855f7;">
                <option value="">Selecione</option>
                <option value="P">P</option>
                <option value="M">M</option>
                <option value="G">G</option>
                <option value="GG">GG</option>
            </select>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label>Forma de pagamento:</label>
            <div class="pagamento-opcoes">
                <label><input type="radio" name="pagamento" value="pix" required> Pix</label>
                <label><input type="radio" name="pagamento" value="credito"> Cartão de Crédito</label>
                <label><input type="radio" name="pagamento" value="boleto"> Boleto</label>
            </div>

            <div class="parcelamento" id="parcelamento" style="display:none;">
                <label for="parcelas">Parcelar em até:</label>
                <select id="parcelas" name="parcelas">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                    <option value="4">4x</option>
                    <option value="5">5x</option>
                </select>
            </div>

            <button type="button" class="uiverse-btn" onclick="window.location.href='finalizeacompra.html'">Finalizar Compra</button>
            <button type="button" class="uiverse-btn continuar-btn" style="margin-top: 10px; font-size: 0.9rem; padding: 6px 16px;" onclick="window.location.href='index.html'">Continuar comprando</button>
        </form>
    </div>
    <script>
        // Exibe opção de parcelamento apenas para crédito
        document.querySelectorAll('input[name="pagamento"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                var parcelaDiv = document.getElementById('parcelamento');
                if (this.value === 'credito') {
                    parcelaDiv.style.display = 'block';
                } else {
                    parcelaDiv.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
