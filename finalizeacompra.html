<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra</title>
    <link rel="stylesheet" href="css/finalizeacompra.css">
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <button class="uiverse-btn" onclick="window.location.href='index.html'" style="position: absolute; top: 20px; left: 20px; z-index: 1000;">Voltar</button>
    
    <div class="finalizar-container">
        <h1 class="finalizar-titulo">Finalizar Compra</h1>
        
        <!-- Etapa 1: Confirmação de dados -->
        <div id="etapa-confirmacao" class="etapa-compra">
            <h2>Confirme seus dados</h2>
            <div class="dados-usuario">
                <p><strong>Nome:</strong> <span id="usuario-nome">...</span></p>
                <p><strong>CPF:</strong> <span id="usuario-cpf">...</span></p>
                <p><strong>CEP:</strong> <span id="usuario-cep">...</span></p>
                <p><strong>Endereço:</strong> <span id="usuario-endereco">...</span></p>
                <p><strong>Data de Nascimento:</strong> <span id="usuario-nascimento">...</span></p>
            </div>
            
            <div class="dados-pedido">
                <h3>Detalhes do Pedido</h3>
                <p><strong>Produto:</strong> <span id="produto-nome">...</span></p>
                <p><strong>Tamanho:</strong> <span id="produto-tamanho">...</span></p>
                <p><strong>Preço:</strong> <span id="produto-preco">...</span></p>
                <p><strong>Forma de Pagamento:</strong> <span id="forma-pagamento">...</span></p>
            </div>

            <button class="uiverse-btn" onclick="confirmarDados()">Confirmar Dados</button>
        </div>
            <!-- Campos ocultos para detalhes do produto -->
            <input type="hidden" id="produto-nome" name="produto-nome">
            <input type="hidden" id="produto-img" name="produto-img">
            <button type="submit" class="uiverse-btn finalizar-btn">Finalizar Compra</button>
        </form>
    </div>
<script>
// Preencher campos ocultos com dados do produto selecionado (exemplo: via localStorage)
var produtoSelecionado = JSON.parse(localStorage.getItem('produtoSelecionado'));
if (produtoSelecionado) {
    document.getElementById('produto-nome').value = produtoSelecionado.nome || '';
    document.getElementById('produto-img').value = produtoSelecionado.img || '';
    // se tivermos id_produto, adiciona como campo oculto
    if (produtoSelecionado.id_produto) {
        var hid = document.createElement('input');
        hid.type = 'hidden'; hid.id = 'produto-id'; hid.name = 'produto-id'; hid.value = produtoSelecionado.id_produto;
        document.querySelector('.finalizar-form').appendChild(hid);
    }
}

document.querySelector('.finalizar-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    try {
        // Re-ler produtoSelecionado (pode ter sido modificado)
        var produtoSelecionado = JSON.parse(localStorage.getItem('produtoSelecionado')) || {};
        var nomeProduto = document.getElementById('produto-nome').value || produtoSelecionado.nome;
        var imgProduto = document.getElementById('produto-img').value || produtoSelecionado.img || '';

        // Tentar garantir que temos o id_produto: se não, busca via API por nome
        var id_produto = produtoSelecionado.id_produto || null;
        if (!id_produto && nomeProduto) {
            try {
                const resp = await fetch('api/get_produto_por_nome.php?nome=' + encodeURIComponent(nomeProduto) + '&create_if_missing=1&preco=' + encodeURIComponent(produtoSelecionado.preco || '') + '&imagem=' + encodeURIComponent(produtoSelecionado.img || ''));
                const dados = await resp.json();
                if (dados && dados.success && dados.id) {
                    id_produto = dados.id;
                }
            } catch (err) {
                console.warn('Erro ao buscar produto por nome:', err);
            }
        }

        if (!id_produto) {
            alert('Não foi possível identificar o produto no catálogo. Contate o suporte ou tente novamente.');
            return; // não finaliza compra sem id_produto
        }

        // Salvar no carrinho local
        var carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        var item = {
            id_produto: id_produto,
            nome: nomeProduto,
            img: imgProduto,
            quantidade: 1,
            preco: produtoSelecionado.preco || null
        };
        carrinho.push(item);
        localStorage.setItem('carrinho', JSON.stringify(carrinho));

        // Se usuário logado, sincroniza com backend imediatamente
        var userData = JSON.parse(localStorage.getItem('userData')) || null;
        if (userData && userData.id) {
            try {
                const addResp = await fetch('carrinho_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `acao=adicionar&id_usuario=${encodeURIComponent(userData.id)}&id_produto=${encodeURIComponent(item.id_produto)}&quantidade=${encodeURIComponent(item.quantidade)}`
                });
                const addResult = await addResp.json().catch(()=>null);
                if (!(addResult && addResult.success)) {
                    console.warn('API de carrinho retornou erro ou resposta inesperada ao adicionar:', addResult);
                }
            } catch (err) {
                console.error('Erro ao sincronizar carrinho:', err);
            }
        }

        // Redirecionar para index
        window.location.href = 'index.html';
    } catch (e) {
        console.error('Erro no processo de finalizar compra:', e);
        alert('Ocorreu um erro ao finalizar a compra. Tente novamente.');
    }
});
</script>
</body>
</html>
