<script>
// Função para verificar o estado do login
function verificarLogin() {
    const usuarioLogado = localStorage.getItem('usuarioLogado');
    const profileBtn = document.getElementById('profileBtn');
    const loginBtn = document.getElementById('loginBtn');
    
    if (usuarioLogado) {
        // Usuário está logado
        if (profileBtn) {
            profileBtn.style.display = 'inline-flex';
            profileBtn.classList.add('visible');
        }
        if (loginBtn) {
            loginBtn.style.display = 'none';
        }
    } else {
        // Usuário não está logado
        if (profileBtn) {
            profileBtn.style.display = 'none';
            profileBtn.classList.remove('visible');
        }
        if (loginBtn) {
            loginBtn.style.display = 'inline-block';
        }
    }
}

// Verificar o estado do login quando a página carrega
window.addEventListener('load', function() {
    verificarLogin();
});

// Verificar quando o DOM estiver completamente carregado
document.addEventListener('DOMContentLoaded', function() {
    verificarLogin();
});

// Verificar novamente após um breve delay para garantir que tudo foi carregado
setTimeout(verificarLogin, 500);

// Verificar periodicamente
setInterval(verificarLogin, 2000);
</script>

<script>
function realizarPesquisa() {
    const searchInput = document.getElementById('search-input');
    const termo = searchInput.value.toLowerCase().trim();

    const paginas = {
        'novidades': 'novidades.html',
        'sobre nos': 'Sobrenos.html',
        'sobre nós': 'Sobrenos.html',
        'sobrenos': 'Sobrenos.html',
        'coleção': 'coleção.html',
        'colecao': 'coleção.html',
        'suporte': 'suporte.html',
        // Páginas de detalhes
        'angel verde': 'detalhes-angelverde.html',
        'dinheiro e veneno': 'detalhes-dinheiroeveneno.html',
        'global': 'detalhes-global.html',
        'limbo': 'detalhes-limbo.html',
        'narcissist': 'detalhes-narcissist.html',
        'remove the mask': 'detalhes-removethemask.html',
        'scorpion': 'detalhes-scorpion.html',
        'scorpion angel': 'detalhes-scorpionangel.html',
        'scorpion gang': 'detalhes-scorpiongang.html',
        'the boss': 'detalhes-theboss.html',
        'the end': 'detalhes-theend.html',
        'the scorpion world': 'detalhes-thescorpionworld.html',
        'verde e rosa': 'detalhes-verdeerosa.html',
        'the monster of scorpion': 'dethalhes-themonster-of-scorpion.html'
    };

    // Verifica se o termo de pesquisa corresponde a alguma página
    for (let key in paginas) {
        if (termo.includes(key)) {
            window.location.href = paginas[key];
            return;
        }
    }

    // Se não encontrar correspondência exata, tenta encontrar parcial
    for (let key in paginas) {
        if (key.includes(termo) || termo.includes(key)) {
            window.location.href = paginas[key];
            return;
        }
    }

    // Se não encontrar nenhuma correspondência
    alert('Página não encontrada. Você pode pesquisar por:\n\n' +
          '- Páginas principais: novidades, sobre nós, coleção, suporte\n' +
          '- Produtos: angel verde, dinheiro e veneno, global, limbo, narcissist,\n' +
          '  remove the mask, scorpion, scorpion angel, scorpion gang, the boss,\n' +
          '  the end, the scorpion world, verde e rosa, the monster of scorpion');
}

// Adiciona evento de tecla Enter para realizar a pesquisa
document.getElementById('search-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        realizarPesquisa();
    }
});
</script>
